name: "✨ Feature / Task"
description: "macOS 앱 기능 구현, 모듈 개발, 빌드/배포 인프라 작업"
title: "[Feat] "
labels: ["feat"]
body:
  - type: textarea
    id: background
    attributes:
      label: "🎯 목적 및 배경"
      description: "PRD/ADR 근거 기반 구현 목적 요약"
      placeholder: "- 해결 대상:
- 기대 결과:"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "🧩 대상 영역"
      options:
        - "Telemetry & Core"
        - "Efficiency Engine"
        - "macOS UI & Widget"
        - "Plan ROI"
        - "Release & Infra"
    validations:
      required: true
  - type: checkboxes
    id: target_cli
    attributes:
      label: "🤖 대상 CLI / 컴포넌트"
      options:
        - label: "Gemini CLI (~/.gemini)"
        - label: "Claude Code (~/.claude)"
        - label: "OpenAI Codex CLI (~/.codex)"
        - label: "공통 / UI / 인프라"
  - type: input
    id: prd_ref
    attributes:
      label: "📄 관련 PRD / ADR 링크"
      placeholder: "예: agents-usage-mac-wiki#3, FR-01"
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "📋 세부 요구사항 및 완료 조건"
      value: |
        - [ ] 핵심 로직 구현
        - [ ] 단위/통합 테스트 작성 및 통과 (`swift test`)
        - [ ] 데이터 정확도(`실측`/`추정`) 및 프라이버시 가드레일 검증
    validations:
      required: true
